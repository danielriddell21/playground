apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: shortlinks.links.playground.dev
spec:
  group: links.playground.dev
  names:
    kind: ShortLink
    listKind: ShortLinkList
    plural: shortlinks
    singular: shortlink
    shortNames: [sl]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Slug, type: string, jsonPath: .status.slug}
        - {name: Target, type: string, jsonPath: .spec.target}
        - {name: Ready, type: boolean, jsonPath: .status.ready}
        - {name: URL, type: string, jsonPath: .status.url, priority: 1}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [target]
              properties:
                target:
                  type: string
                  pattern: '^https?://.+'
                slug:
                  type: string
                  pattern: '^[a-zA-Z0-9_-]{3,32}$'
            status:
              type: object
              properties:
                slug: {type: string}
                url: {type: string}
                ready: {type: boolean}
                message: {type: string}
                observedGeneration: {type: integer, format: int64}
